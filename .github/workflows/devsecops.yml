name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Versión de la app a analizar"
        type: choice
        options: [secure, vulnerable]
        default: secure

permissions:
  contents: read

env:
  TARGET: ${{ github.event.inputs.target || 'secure' }}

jobs:
  secrets-scan:
    name: 1 · Secretos (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Gitleaks
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks
      - name: Buscar secretos en el código
        run: |
          set +e
          ./gitleaks detect --no-git --source "$TARGET" --redact --report-format sarif --report-path gitleaks.sarif
          code=$?
          set -e
          n=$(jq '[.runs[].results[]] | length' gitleaks.sarif)
          estado=$([ "$code" -eq 0 ] && echo "✅ Aprobado" || echo "❌ Bloqueado")
          {
            echo "### 1 · Secretos (Gitleaks)"
            echo "Versión analizada: \`$TARGET\`"
            echo
            echo "| Secretos encontrados | Resultado |"
            echo "|---|---|"
            echo "| $n | $estado |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Subir hallazgos a la pestaña Security
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sast:
    name: 2 · Código (SAST con Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Analizar código
        run: |
          set +e
          semgrep scan --config semgrep-rules.yml --metrics off --error --sarif --output semgrep.sarif "$TARGET"
          code=$?
          set -e
          n=$(jq '[.runs[].results[]] | length' semgrep.sarif)
          estado=$([ "$code" -eq 0 ] && echo "✅ Aprobado" || echo "❌ Bloqueado")
          {
            echo "### 2 · Código (SAST con Semgrep)"
            echo "Versión analizada: \`$TARGET\`"
            echo
            echo "| Hallazgos | Resultado |"
            echo "|---|---|"
            echo "| $n | $estado |"
            if [ "$n" -gt 0 ]; then
              echo
              echo "| Regla | Ubicación |"
              echo "|---|---|"
              jq -r '.runs[].results[] | "| \(.ruleId | split(".") | last) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) |"' semgrep.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Subir hallazgos a la pestaña Security
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: 3 · Dependencias (SCA con pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Auditar dependencias
        run: |
          set +e
          pip-audit -r "$TARGET/requirements.txt" --strict -f json -o pip-audit.json
          code=$?
          set -e
          n=$(jq '[.dependencies[].vulns[]?] | length' pip-audit.json)
          estado=$([ "$code" -eq 0 ] && echo "✅ Aprobado" || echo "❌ Bloqueado")
          {
            echo "### 3 · Dependencias (SCA con pip-audit)"
            echo "Versión analizada: \`$TARGET\`"
            echo
            echo "| Vulnerabilidades | Resultado |"
            echo "|---|---|"
            echo "| $n | $estado |"
            if [ "$n" -gt 0 ]; then
              echo
              echo "| Paquete | Versión | Vulnerabilidades |"
              echo "|---|---|---|"
              jq -r '.dependencies[] | select((.vulns | length) > 0) | "| \(.name) | \(.version) | \(.vulns | length) |"' pip-audit.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  dast:
    name: 4 · Análisis dinámico (DAST con OWASP ZAP, solo informe)
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast, sca]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Levantar la aplicación
        run: |
          pip install -r "$TARGET/requirements.txt"
          cd "$TARGET" && nohup python app.py > ../app.log 2>&1 &
          sleep 5
      - name: Escaneo ZAP (baseline)
        run: |
          chmod 777 "$PWD"
          docker run --rm --network host -v "$PWD":/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:5000 -r zap-report.html -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-report.html

  resultado:
    name: Resultado del pipeline
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast, sca, dast]
    if: always()
    steps:
      - name: Evaluar las etapas
        env:
          R1: ${{ needs.secrets-scan.result }}
          R2: ${{ needs.sast.result }}
          R3: ${{ needs.sca.result }}
          R4: ${{ needs.dast.result }}
        run: |
          icono() {
            case "$1" in
              success) echo "✅ Aprobada" ;;
              failure) echo "❌ Falló" ;;
              skipped) echo "⏭️ Omitida" ;;
              *) echo "⚠️ $1" ;;
            esac
          }
          {
            echo "## Resultado del pipeline"
            echo "Versión analizada: \`$TARGET\`"
            echo
            echo "| Etapa | Estado | Bloquea el cambio |"
            echo "|---|---|---|"
            echo "| 1 · Secretos (Gitleaks) | $(icono "$R1") | Sí |"
            echo "| 2 · Código (Semgrep) | $(icono "$R2") | Sí |"
            echo "| 3 · Dependencias (pip-audit) | $(icono "$R3") | Sí |"
            echo "| 4 · Dinámico (ZAP) | $(icono "$R4") | No, solo informe |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$R1" = "success" ] && [ "$R2" = "success" ] && [ "$R3" = "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **PIPELINE APROBADO**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **PIPELINE BLOQUEADO**: corregir antes de unir el cambio" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi